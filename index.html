<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>올해의 연말결산 스티커 만들기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
:root{--bg:#F1F1F1;--pink:#FBC2C2;--blue:#BFD4F2;--yel:#F9ECBF;--ink:#4F4F4F}
*{box-sizing:border-box}
body{margin:0;font-family:"Pretendard",-apple-system,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);-webkit-user-select:none;user-select:none}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 28px}
h1{margin:0 0 2px}
.ttl{display:block;width:100%;height:auto;pointer-events:none}
.by{font-size:12px;margin:0 0 14px}
.by a{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;align-items:center}
.lb{font-size:13px}
button{font:inherit;font-size:14px;padding:8px 12px;border:1.5px solid var(--ink);background:var(--yel);border-radius:10px;cursor:pointer;color:var(--ink)}
button.on{background:var(--pink)}
button.main{background:var(--blue);font-weight:600}
button.pk{background:var(--pink);font-weight:600}
button.sw{width:30px;height:30px;padding:0;border-radius:50%}
button.sw.on{outline:3px solid var(--ink);outline-offset:2px}
button:disabled{opacity:.35}
.stage{border:1.5px solid var(--ink);border-radius:14px;padding:10px;display:flex;justify-content:center}
canvas{max-width:100%;max-height:62vh;touch-action:none;background:var(--bg);border:1.5px solid var(--ink)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid button{padding:2px;background:var(--bg);aspect-ratio:5/4;display:flex;align-items:center;justify-content:center}
.grid img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}
label{font-size:13px;display:flex;align-items:center;gap:8px;flex:1;min-width:140px}
input[type=range]{flex:1;accent-color:var(--ink)}
#txt{flex:1;font:inherit;font-size:16px;padding:8px 10px;border:1.5px solid var(--ink);border-radius:10px;background:var(--bg);color:var(--ink);-webkit-user-select:text;user-select:text}
#txt:disabled{opacity:.5}
small{display:block;margin:6px 0}
h2{font-size:13px;margin:16px 0 4px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
<h1><img class="ttl" src="title.png" alt="올해를 마무리하며… 연말 결산 스티커를 붙여봐요!"></h1>
<p class="by">만든 사람 : Instagram <a href="https://www.instagram.com/nib__photo/" target="_blank" rel="noopener">@nib__photo</a></p>

<div class="row">
  <button class="pk" id="pick">📷 사진 고르기</button>
  <input type="file" id="file" accept="image/*" hidden>
</div>

<h2>결과물 비율</h2>
<div class="row" id="ratios">
  <button data-r="9:16">9:16 스토리</button>
  <button data-r="4:5" class="on">4:5 캐러셀</button>
  <button data-r="1:1">1:1</button>
  <button data-r="orig">원본 비율</button>
</div>
<div class="row" id="fitrow">
  <button data-f="cover" class="on">사진 꽉 채우기</button>
  <button data-f="contain">전체 보이기</button>
</div>
<div class="row" id="bgrow"><span class="lb">빈 공간 색</span><button data-b="#fff" class="on">흰색</button><button data-b="#000">검정</button></div>

<div class="stage"><canvas id="cv"></canvas></div>
<small>라벨을 드래그하면 라벨이, 라벨 없는 곳을 드래그하면 사진이 움직여요 · 두 손가락으로 크기(라벨은 회전도) · PC는 마우스 휠</small>

<h2>글씨 쓰기</h2>
<div class="row"><button id="addtxt" class="pk">＋ 사진에 글씨 추가</button></div>
<div class="row"><input id="txt" type="text" disabled placeholder="글씨나 '무제' 라벨을 선택하면 여기서 입력해요"></div>
<small>'무제' 라벨은 최대 4글자, 한 칸에 한 글자씩 들어가요. 띄어쓰기로 칸을 비울 수 있어요 (예: 첫 도전)</small>
<div class="row" id="fonts"></div>
<div class="row" id="cols" style="gap:8px"></div>


<div class="row">
  <label>크기 <input type="range" id="size" min="0.08" max="1.2" step="0.01" disabled></label>
  <label>회전 <input type="range" id="rot" min="-180" max="180" step="1" disabled></label>
  <button id="del" disabled>선택 삭제</button>
</div>

<div class="row">
  <label>사진 크기 <input type="range" id="psize" min="0.5" max="3" step="0.01" value="1"></label>
  <button id="preset">사진 위치 초기화</button>
</div>

<h2>라벨 고르기 (탭하면 추가돼요)</h2>
<div class="grid" id="grid"></div>



<div class="row" style="margin-top:16px">
  <button class="main" id="save" style="flex:1;padding:14px">💾 이미지 저장</button>
</div>
</div>

<script>
const LABELS=[["food","음식"],["song","노래"],["movie","영화"],["book","책"],["novel","소설"],["concert","공연"],["travel","여행"],["space","공간"],["exercise","운동"],["achievement","성취"],["first","첫도전"],["spend","최고소비"],["thanks","감사"],["failure","실패"],["sadness","슬픔"],["untitled","무제"]];
const RS={"9:16":[1080,1920],"4:5":[1080,1350],"1:1":[1080,1080]};
const $=s=>document.querySelector(s);
const cv=$("#cv"),ctx=cv.getContext("2d");
let photo=null,ratio="4:5",fit="cover",bg="#fff",layers=[],sel=null,ps=1,pox=0,poy=0;
function resetPhoto(){ps=1;pox=0;poy=0;$("#psize").value=1}

// 투명 여백 잘라내기
function crop(img){
  const c=document.createElement("canvas");c.width=img.width;c.height=img.height;
  const x=c.getContext("2d");x.drawImage(img,0,0);
  try{
    const d=x.getImageData(0,0,c.width,c.height).data;
    let l=c.width,t=c.height,r=0,b=0;
    for(let y=0;y<c.height;y++)for(let i=0;i<c.width;i++)if(d[(y*c.width+i)*4+3]>20){if(i<l)l=i;if(i>r)r=i;if(y<t)t=y;if(y>b)b=y}
    if(r<=l||b<=t)return c;
    const o=document.createElement("canvas");o.width=r-l+1;o.height=b-t+1;
    o.getContext("2d").drawImage(c,l,t,o.width,o.height,0,0,o.width,o.height);return o;
  }catch(e){return c}
}

function size(){
  if(ratio==="orig"&&photo){const k=Math.min(1,3000/Math.max(photo.width,photo.height));return[Math.round(photo.width*k),Math.round(photo.height*k)]}
  return RS[ratio]||RS["4:5"];
}
function dims(L){const w=L.w*cv.width;return[w,w*L.c.height/L.c.width]}

function draw(exp){
  const[W,H]=size();
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  if(photo){
    const k=(fit==="cover"?Math.max:Math.min)(W/photo.width,H/photo.height);
    const w=photo.width*k*ps,h=photo.height*k*ps;
    ctx.drawImage(photo,(W-w)/2+pox*W,(H-h)/2+poy*H,w,h);
  }else{
    ctx.fillStyle=bg==="#000"?"#F1F1F1":"#4F4F4F";ctx.font=W/18+"px sans-serif";ctx.textAlign="center";
    ctx.fillText("사진을 골라주세요",W/2,H/2);
  }
  layers.forEach(L=>{
    const[w,h]=dims(L);
    ctx.save();ctx.translate(L.x*W,L.y*H);ctx.rotate(L.r*Math.PI/180);
    ctx.drawImage(L.c,-w/2,-h/2,w,h);
    if(!exp&&L===sel){ctx.lineWidth=Math.max(6,W/150);ctx.strokeStyle="#F1F1F1";ctx.strokeRect(-w/2,-h/2,w,h);ctx.lineWidth=Math.max(3,W/300);ctx.strokeStyle="#4F4F4F";ctx.setLineDash([W/60,W/90]);ctx.strokeRect(-w/2,-h/2,w,h)}
    ctx.restore();
  });
}
function sync(){
  const on=!!sel;
  ["#size","#rot","#del"].forEach(s=>$(s).disabled=!on);
  if(sel){$("#size").value=sel.w;$("#rot").value=sel.r}
  const tx=!!(sel&&sel.kind),t=$("#txt");
  t.disabled=!tx;
  document.querySelectorAll("#fonts button,#cols button").forEach(b=>b.disabled=!tx);
  if(tx){t.maxLength=sel.kind==="blank"?4:20;if(t.value!==sel.text)t.value=sel.text;
    document.querySelectorAll("#fonts button").forEach(b=>b.classList.toggle("on",b.dataset.id===sel.font));
    document.querySelectorAll("#cols button").forEach(b=>b.classList.toggle("on",b.dataset.c===sel.color))}
  else t.value="";
}

// 라벨 목록
LABELS.forEach(([id,name])=>{
  const img=new Image();
  img.onload=()=>{
    const c=crop(img);
    const b=document.createElement("button");b.title="올해의 "+name;
    const t=new Image();t.src=c.toDataURL();b.appendChild(t);
    b.onclick=()=>{
      const L={c,x:.5,y:.5,w:.45,r:0};
      if(id==="untitled"){Object.assign(L,{kind:"blank",img,text:"",font:"min",color:"#4F4F4F"});layers.push(L);sel=L;sync();refresh(L);$("#txt").focus();return}
      layers.push(L);sel=L;sync();draw()};
    $("#grid").appendChild(b);
  };
  img.src="labels/"+id+".png";
});

// 사진 선택
$("#pick").onclick=()=>$("#file").click();
$("#file").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const im=new Image();
  im.onload=()=>{photo=im;resetPhoto();draw()};
  im.src=URL.createObjectURL(f);
};

// 옵션
$("#ratios").onclick=e=>{const r=e.target.dataset.r;if(!r)return;ratio=r;resetPhoto();
  [...$("#ratios").children].forEach(b=>b.classList.toggle("on",b===e.target));draw()};
$("#fitrow").onclick=e=>{const f=e.target.dataset.f;if(!f)return;fit=f;
  [...$("#fitrow").children].forEach(b=>b.classList.toggle("on",b===e.target));draw()};
$("#size").oninput=e=>{if(sel){sel.w=+e.target.value;draw()}};
$("#rot").oninput=e=>{if(sel){sel.r=+e.target.value;draw()}};
$("#del").onclick=()=>{layers=layers.filter(l=>l!==sel);sel=null;sync();draw()};

$("#psize").oninput=e=>{ps=+e.target.value;draw()};
$("#preset").onclick=()=>{resetPhoto();draw()};

$("#bgrow").onclick=e=>{const b=e.target.dataset.b;if(!b)return;bg=b;
  [...$("#bgrow").children].forEach(x=>x.classList.toggle("on",x===e.target));draw()};

// 글씨 · 폰트 · 색
const PAL=["#F1F1F1","#FBC2C2","#BFD4F2","#F9ECBF","#4F4F4F"];
const FONTS=[{id:"pre",name:"Pretendard",css:"Pretendard",w:700},{id:"min",name:"윤 민국",css:"YoonMinGuk",w:400,files:["fonts/YoonChildfundkoreaMinGuk.otf","fonts/YoonChildfundkoreaMinGuk.ttf","fonts/YoonChildfundkoreaMinGuk.OTF","fonts/YoonChildfundkoreaMinGuk.TTF"]}];
const fontOf=id=>FONTS.find(f=>f.id===id&&!f.off)||FONTS[0];
async function loadFont(f,t){
  if(f.face){f.p=f.p||f.face.load().then(()=>document.fonts.add(f.face));await f.p}
  else await document.fonts.load(`${f.w} 100px "${f.css}"`,t||"가");
}
function renderText(t,f,col){
  const S=200,c=document.createElement("canvas"),x=c.getContext("2d"),fn=`${f.w} ${S}px "${f.css}",sans-serif`;
  x.font=fn;c.width=Math.ceil(x.measureText(t).width)+S;c.height=S*2;
  x.font=fn;x.fillStyle=col;x.textAlign="center";x.textBaseline="middle";x.fillText(t,c.width/2,S);
  return crop(c);
}
const CELLS=[136,221,299,377]; // '무제' 라벨 2번째 줄 칸 중심(x), y=213
function renderBlank(L,f){
  const k=2,c=document.createElement("canvas"),x=c.getContext("2d");
  c.width=L.img.width*k;c.height=L.img.height*k;x.drawImage(L.img,0,0,c.width,c.height);
  x.font=`${f.w} ${56*k}px "${f.css}",sans-serif`;x.fillStyle=L.color;x.textAlign="center";x.textBaseline="middle";
  Array.from(L.text).slice(0,4).forEach((ch,i)=>{if(ch.trim())x.fillText(ch,CELLS[i]*k,215*k)});
  return crop(c);
}
async function refresh(L){
  const v=L.v=(L.v||0)+1,f=fontOf(L.font);
  await loadFont(f,L.text||"가");
  if(v!==L.v)return;
  if(L.kind==="blank")L.c=renderBlank(L,f);
  else{
    if(!L.text)return;
    const o=L.c.width/L.c.height,c=renderText(L.text,f,L.color),a=c.width/c.height;
    if(L.fresh){L.w=Math.min(.9,Math.max(.15,.08*a));L.fresh=0}
    else L.w=Math.min(1.2,Math.max(.08,L.w*a/o));
    L.c=c;
  }
  if(L===sel)$("#size").value=L.w;
  draw();
}
$("#addtxt").onclick=()=>{
  const L={kind:"text",text:"올해의 한마디",font:"pre",color:"#4F4F4F",x:.5,y:.5,w:.2,r:0,fresh:1,c:document.createElement("canvas")};
  L.c.width=L.c.height=1;layers.push(L);sel=L;sync();refresh(L).then(()=>$("#txt").focus());
};
$("#txt").oninput=e=>{if(sel&&sel.kind){sel.text=e.target.value;refresh(sel)}};
function buildUI(){
  FONTS.filter(f=>!f.off).forEach(f=>{
    const b=document.createElement("button");b.textContent=f.name;b.dataset.id=f.id;
    b.onclick=()=>{if(sel&&sel.kind){sel.font=f.id;sync();refresh(sel)}};$("#fonts").appendChild(b)});
  const mk=(el,cb)=>PAL.forEach(c=>{const b=document.createElement("button");b.className="sw";b.style.background=c;b.dataset.c=c;b.title=c;b.onclick=()=>cb(c);el.appendChild(b)});
  mk($("#cols"),c=>{if(sel&&sel.kind){sel.color=c;sync();refresh(sel)}});
  sync();
}
async function initFonts(){
  for(const f of FONTS){
    if(!f.files)continue;
    for(const u of f.files){try{const r=await fetch(u,{method:"HEAD"});if(r.ok){f.face=new FontFace(f.css,`url("${u}")`);break}}catch(e){}}
    if(!f.face)f.off=true;
  }
  buildUI();
}

// 포인터 (드래그 / 핀치)
const P=new Map();let g=null;
const pt=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}};
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),ang=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
function hit(px,py){
  for(let i=layers.length-1;i>=0;i--){
    const L=layers[i],[w,h]=dims(L),a=-L.r*Math.PI/180;
    const dx=px-L.x*cv.width,dy=py-L.y*cv.height;
    const lx=dx*Math.cos(a)-dy*Math.sin(a),ly=dx*Math.sin(a)+dy*Math.cos(a);
    if(Math.abs(lx)<=w/2&&Math.abs(ly)<=h/2)return L;
  }return null;
}
cv.addEventListener("pointerdown",e=>{
  cv.setPointerCapture(e.pointerId);const p=pt(e);P.set(e.pointerId,p);
  if(P.size===1){
    const L=hit(p.x,p.y);
    if(L){sel=L;layers.splice(layers.indexOf(L),1);layers.push(L);g={ox:L.x*cv.width-p.x,oy:L.y*cv.height-p.y}}
    else{sel=null;g=photo?{ph:1,sx:p.x,sy:p.y,px:pox,py:poy}:null}
    sync();
  }else if(P.size===2){
    const[a,b]=[...P.values()];
    g=sel?{d:dist(a,b),an:ang(a,b),w:sel.w,r:sel.r}:photo?{ph:1,d:dist(a,b),s:ps}:null;
  }
  draw();
});
cv.addEventListener("pointermove",e=>{
  if(!P.has(e.pointerId))return;P.set(e.pointerId,pt(e));
  if(!g)return;
  if(g.ph){
    if(P.size===1){const p=[...P.values()][0];pox=Math.max(-1,Math.min(1,g.px+(p.x-g.sx)/cv.width));poy=Math.max(-1,Math.min(1,g.py+(p.y-g.sy)/cv.height))}
    else if(P.size===2&&g.d){const[a,b]=[...P.values()];ps=Math.min(3,Math.max(.5,g.s*dist(a,b)/g.d));$("#psize").value=ps}
    draw();return;
  }
  if(!sel)return;
  if(P.size===1&&g.ox!==undefined){
    const p=[...P.values()][0];
    sel.x=Math.min(1.1,Math.max(-.1,(p.x+g.ox)/cv.width));
    sel.y=Math.min(1.1,Math.max(-.1,(p.y+g.oy)/cv.height));
  }else if(P.size===2&&g.d){
    const[a,b]=[...P.values()];
    sel.w=Math.min(1.2,Math.max(.08,g.w*dist(a,b)/g.d));
    sel.r=g.r+ang(a,b)-g.an;
    if(sel.r>180)sel.r-=360;if(sel.r<-180)sel.r+=360;
  }
  sync();draw();
});
const up=e=>{P.delete(e.pointerId);g=null};
cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
cv.addEventListener("wheel",e=>{
  if(!sel&&!photo)return;e.preventDefault();const f=e.deltaY<0?1.06:.94;
  if(sel){sel.w=Math.min(1.2,Math.max(.08,sel.w*f));sync()}
  else{ps=Math.min(3,Math.max(.5,ps*f));$("#psize").value=ps}
  draw();
},{passive:false});

// 저장
$("#save").onclick=()=>{
  draw(true);
  cv.toBlob(async blob=>{
    draw();
    if(!blob){alert("저장에 실패했어요. 사이트 주소(https)로 접속했는지 확인해주세요.");return}
    const file=new File([blob],"올해의-스티커.png",{type:"image/png"});
    const mobile=/Android|iPhone|iPad/i.test(navigator.userAgent);
    if(mobile&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file]});return}catch(e){if(e.name==="AbortError")return}
    }
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="올해의-스티커.png";a.click();
  },"image/png");
};

initFonts();
draw();
</script>
</body>
</html>
